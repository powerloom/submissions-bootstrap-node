version: '3.8'

services:
  bootstrap-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BOOTSTRAP_PORT:-4001}:${BOOTSTRAP_PORT:-4001}"
    env_file:
      - ./.env
    restart: unless-stopped
    volumes:
      # Persist logs on the host VPS
      - ./logs:/app/logs
      - ./logs/archive:/app/logs/archive
    environment:
      - LOG_FILE=/app/logs/bootstrap-node.log
      - LOG_LEVEL=${LOG_LEVEL:-info}
