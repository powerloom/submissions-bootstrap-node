services:
  bootstrap-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BOOTSTRAP_PORT:-4001}:${BOOTSTRAP_PORT:-4001}"
      - "${PPROF_PORT:-6060}:${PPROF_PORT:-6060}"
    env_file:
      - ./.env
    restart: unless-stopped
    volumes:
      # Persist logs on the host VPS
      - ./logs:/app/logs
      - ./logs/archive:/app/logs/archive
    environment:
      - LOG_FILE=/app/logs/bootstrap-node.log
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PPROF_PORT=${PPROF_PORT:-6060}
    logs:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
